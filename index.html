<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>Repräsentanzleiter Cockpit</title>
<style>
:root{--bg:#090b0f;--panel:#171b22;--panel2:#101318;--line:#303641;--gold:#c9973e;--gold2:#f0c96b;--text:#f5f6f7;--muted:#a9afbb;--red:#ff7f7f;--green:#70e09a;--blue:#78aefc}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit} button{cursor:pointer}
.wrap{max-width:1400px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end}.eyebrow{color:var(--gold2);font-weight:800;letter-spacing:3px}.title{font-size:32px;font-weight:900;margin:4px 0}.sub{color:var(--muted)}
.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#252a33;color:#fff;border-radius:10px;padding:12px 16px;font-weight:750}.btn.gold{background:var(--gold);color:#111;border-color:var(--gold)}.btn.danger{color:#fff}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav button.active{background:var(--gold);color:#111}
.page{display:none}.page.active{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}.panel h2{margin:0 0 14px}
.hero{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#050608;margin-bottom:16px}.hero img{width:100%;display:block;max-height:500px;object-fit:cover}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:15px}.card small{color:var(--muted);display:block;margin-bottom:5px}.big{font-size:25px;font-weight:900}.gold{color:var(--gold2)}.red{color:var(--red)}.green{color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
label{display:block;color:var(--muted);font-size:13px;font-weight:750;margin-bottom:6px}input,select{width:100%;background:#0d0f14;border:1px solid var(--line);color:#fff;border-radius:9px;padding:12px}
.field{margin-bottom:12px}.section-title{font-size:18px;font-weight:850;margin:4px 0 12px}.hint{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px}
.status{font-weight:850}.bar{height:10px;background:#292e37;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--gold);width:0}
.split{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.split .card{border-top:3px solid var(--gold)}
.notice{padding:12px;border-left:3px solid var(--gold);background:#101318;border-radius:8px;color:#dfe2e7}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.loginbox h1{margin-top:0}
.toast{position:fixed;right:18px;bottom:18px;background:#151922;border:1px solid var(--line);padding:12px 16px;border-radius:10px;display:none}
@media(max-width:900px){.cards,.grid4,.split{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
@media(max-width:600px){.cards,.grid4,.split{grid-template-columns:1fr}.wrap{padding:10px}.title{font-size:27px}.nav button{flex:1}.hero img{max-height:none}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="loginbox">
    <div class="eyebrow">PERSÖNLICHES COCKPIT</div>
    <h1>REPRÄSENTANZLEITER</h1>
    <p class="sub">Bitte anmelden, um dein Ziel-Cockpit zu öffnen.</p>

    <div class="field">
      <label>Benutzername</label>
      <input id="loginUser" autocomplete="username">
    </div>

    <div class="field">
      <label>Passwort</label>
      <input id="loginPass" type="password" autocomplete="current-password">
    </div>

    <button class="btn gold" style="width:100%" onclick="login()">Einloggen</button>
    <p id="loginErr" class="red"></p>
  </div>
</div>

<div id="app" style="display:none">
<div class="wrap">

  <div class="top">
    <div>
      <div class="eyebrow">AB HEUTE</div>
      <div class="title">REPRÄSENTANZLEITER</div>
      <div class="sub">Ziel-, Monats- und Führungs-Cockpit</div>
    </div>

    <div class="actions">
      <button class="btn" onclick="exportData()">Daten sichern</button>
      <button class="btn" onclick="logout()">Abmelden</button>
    </div>
  </div>

  <nav class="nav">
    <button class="btn active" data-page="dashboard">Dashboard</button>
    <button class="btn" data-page="own">Eigenvolumen</button>
    <button class="btn" data-page="zorn">Team Zorn</button>
    <button class="btn" data-page="biewer">Team Biewer</button>
    <button class="btn" data-page="deckers">Team Deckers</button>
    <button class="btn" data-page="gesamt">Gesamtübersicht</button>
    <button class="btn" data-page="missing">Was fehlt?</button>
    <button class="btn" data-page="history">Verlauf</button>
    <button class="btn" data-page="settings">Einstellungen</button>
    <button class="btn" data-page="guide">Anleitung</button>
  </nav>

  <section id="dashboard" class="page active"></section>
  <section id="own" class="page"></section>
  <section id="zorn" class="page"></section>
  <section id="biewer" class="page"></section>
  <section id="deckers" class="page"></section>
  <section id="gesamt" class="page"></section>
  <section id="missing" class="page"></section>
  <section id="history" class="page"></section>
  <section id="settings" class="page"></section>
  <section id="guide" class="page"></section>

</div>
</div>

<div id="toast" class="toast"></div>

<script>

const KEY="repraes2026_v3";

const defaultState={
  settings:{
    gesamt:3500000,
    own:1050000,
    customer:50000,
    close:50,
    contacts:32,
    partners:2
  },
  months:{},
  credentials:{
    user:"matthias",
    pass:"1409"
  }
};

const areas={
  own:{
    name:"Eigenvolumen",
    short:"Ich / Matthias",
    pct:.30,
    targetKey:"own"
  },

  zorn:{
    name:"Team Zorn",
    short:"Team Zorn",
    pct:.40,
    targetFixed:1400000
  },

  biewer:{
    name:"Team Biewer",
    short:"Team Biewer",
    pct:.15,
    targetFixed:525000
  },

  deckers:{
    name:"Team Deckers",
    short:"Team Deckers",
    pct:.15,
    targetFixed:525000
  }
};

let state=load();

function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY)||"{}");

    return Object.assign(
      {},
      defaultState,
      saved,
      {
        settings:Object.assign(
          {},
          defaultState.settings,
          saved.settings||{}
        ),
        months:saved.months||{}
      }
    );

  }catch(e){
    return structuredClone(defaultState);
  }
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
  toast("Gespeichert ✓");
}

function toast(t){
  const x=document.getElementById("toast");
  x.textContent=t;
  x.style.display="block";

  setTimeout(()=>{
    x.style.display="none";
  },1800);
}

function monthKey(){
  return new Date().toISOString().slice(0,7);
}

function monthLabel(k){
  const [y,m]=k.split("-");

  return new Date(
    Number(y),
    Number(m)-1,
    1
  ).toLocaleDateString(
    "de-DE",
    {
      month:"long",
      year:"numeric"
    }
  );
}

function getMonth(k){

  if(!state.months[k]){
    state.months[k]={
      own:{},
      zorn:{},
      biewer:{},
      deckers:{}
    };
  }

  return state.months[k];
}

function num(id){
  return Number(
    document.getElementById(id)?.value||0
  );
}

function money(n){
  return new Intl.NumberFormat(
    "de-DE",
    {
      style:"currency",
      currency:"EUR",
      maximumFractionDigits:0
    }
  ).format(n||0);
}

function pct(n){
  return (
    (n||0).toLocaleString(
      "de-DE",
      {
        maximumFractionDigits:1
      }
    )+"%"
  );
}

function target(a){
  return a.targetFixed ??
    (state.settings.gesamt*a.pct);
}

function monthArea(k,a){

  return Object.assign(
    {
      revenue:0,
      customers:0,
      contacts:0,
      appointments:0
    },
    getMonth(k)[a]||{}
  );
}

function login(){

  const u=document.getElementById("loginUser").value;
  const p=document.getElementById("loginPass").value;

  if(
    u===state.credentials.user &&
    p===state.credentials.pass
  ){

    sessionStorage.setItem(
      "repraes_login",
      "1"
    );

    showApp();

  }else{

    document.getElementById(
      "loginErr"
    ).textContent=
      "Benutzername oder Passwort falsch.";
  }
}

function logout(){
  sessionStorage.removeItem(
    "repraes_login"
  );

  location.reload();
}

function showApp(){

  document.getElementById(
    "login"
  ).style.display="none";

  document.getElementById(
    "app"
  ).style.display="block";

  renderAll();
}

if(
  sessionStorage.getItem(
    "repraes_login"
  )==="1"
){
  showApp();
}

document.querySelectorAll(
  "[data-page]"
).forEach(b=>{

  b.onclick=()=>{

    document.querySelectorAll(
      ".page"
    ).forEach(
      p=>p.classList.remove("active")
    );

    document.querySelectorAll(
      "[data-page]"
    ).forEach(
      x=>x.classList.remove("active")
    );

    document.getElementById(
      b.dataset.page
    ).classList.add("active");

    b.classList.add("active");
  };

});

function renderArea(id){

  const a=areas[id];
  const k=monthKey();
  const d=monthArea(k,id);
  const t=target(a);
  const r=d.revenue;
  const c=d.customers;

  document.getElementById(id).innerHTML=`

  <div class="panel">

    <h2>${a.name}</h2>

    <div class="hint">
      Monat: ${monthLabel(k)}
      · Zielanteil ${(a.pct*100).toFixed(0)}%
      · Jahresziel ${money(t)}
    </div>

  </div>

  <div class="grid2">

    <div class="panel">

      <div class="section-title">
        Umsatz & Kunden
      </div>

      <div class="field">
        <label>Umsatz (€)</label>
        <input
          id="${id}Revenue"
          type="number"
          value="${r}"
        >
      </div>

      <div class="field">
        <label>Gewonnene Kunden</label>
        <input
          id="${id}Customers"
          type="number"
          value="${c}"
        >
      </div>

    </div>

    <div class="panel">

      <div class="section-title">
        Aktivität
      </div>

      <div class="field">
        <label>Kontakte / Gespräche</label>
        <input
          id="${id}Contacts"
          type="number"
          value="${d.contacts||0}"
        >
      </div>

      <div class="field">
        <label>Serientermine</label>
        <input
          id="${id}Appointments"
          type="number"
          value="${d.appointments||0}"
        >
      </div>

    </div>

  </div>

  <div class="panel">

    <button
      class="btn gold"
      onclick="saveArea('${id}')"
    >
      ${a.name}
      für ${monthLabel(k)}
      speichern
    </button>

  </div>

  <div class="panel">

    <h2>Jahresstand</h2>

    <div class="cards">

      <div class="card">
        <small>ZIEL</small>
        <div class="big">
          ${money(t)}
        </div>
      </div>

      <div class="card">
        <small>IST</small>
        <div class="big">
          ${money(r)}
        </div>
      </div>

      <div class="card">

        <small>FEHLT</small>

        <div
          class="big ${
            t-r<=0
              ?"green"
              :"red"
          }"
        >
          ${money(Math.max(0,t-r))}
        </div>

      </div>

      <div class="card">

        <small>ERREICHT</small>

        <div class="big">
          ${pct(
            Math.min(
              100,
              r/t*100
            )
          )}
        </div>

      </div>

    </div>

  </div>

  `;
}

function saveArea(id){

  const k=monthKey();
  const m=getMonth(k);

  m[id]={
    revenue:num(id+"Revenue"),
    customers:num(id+"Customers"),
    contacts:num(id+"Contacts"),
    appointments:num(id+"Appointments")
  };

  save();
  renderAll();
}

function renderDashboard(){

  const k=monthKey();

  const own=monthArea(k,"own");
  const z=monthArea(k,"zorn");
  const b=monthArea(k,"biewer");
  const d=monthArea(k,"deckers");

  const total=
    own.revenue+
    z.revenue+
    b.revenue+
    d.revenue;

  document.getElementById(
    "dashboard"
  ).innerHTML=`

  <div class="hero">

    <img
      src="repaesentanzleiter-titelbild.jpg"
      alt="Repräsentanzleiter Motivation"
      onerror="this.style.display='none'"
    >

  </div>

  <div class="panel">

    <h2>
      Aktueller Monatsstand
      · ${monthLabel(k)}
    </h2>

    <div class="cards">

      <div class="card">
        <small>GESAMTZIEL</small>
        <div class="big gold">
          ${money(state.settings.gesamt)}
        </div>
      </div>

      <div class="card">
        <small>EIGENVOLUMEN</small>
        <div class="big">
          ${money(own.revenue)}
        </div>
      </div>

      <div class="card">
        <small>TEAMUMSATZ</small>
        <div class="big">
          ${money(
            z.revenue+
            b.revenue+
            d.revenue
          )}
        </div>
      </div>

      <div class="card">
        <small>GESAMTUMSATZ</small>
        <div class="big">
          ${money(total)}
        </div>
      </div>

    </div>

  </div>

  <div class="panel">

    <h2>
      40 / 30 / 15 / 15 Aufteilung
    </h2>

    <div class="split">

      ${splitCard(
        "Team Zorn",
        z.revenue,
        1400000,
        .40
      )}

      ${splitCard(
        "Ich / Matthias",
        own.revenue,
        state.settings.own,
        .30
      )}

      ${splitCard(
        "Team Biewer",
        b.revenue,
        525000,
        .15
      )}

      ${splitCard(
        "Team Deckers",
        d.revenue,
        525000,
        .15
      )}

    </div>

  </div>

  `;
}

function splitCard(n,ist,t,p){

  return `

  <div class="card">

    <small>
      ${n}
      · ${(p*100).toFixed(0)}%
    </small>

    <div class="big">
      ${money(ist)}
    </div>

    <div class="hint">
      Jahresziel ${money(t)}
    </div>

    <div class="bar">

      <div
        class="fill"
        style="
          width:${Math.min(
            100,
            ist/t*100
          )}%
        "
      ></div>

    </div>

    <div class="hint">
      ${pct(
        Math.min(
          100,
          ist/t*100
        )
      )}
      erreicht
    </div>

  </div>

  `;
}

function renderGesamt(){

  const k=monthKey();

  let rows="";
  let total=0;

  for(
    const [id,a]
    of Object.entries(areas)
  ){

    const d=monthArea(k,id);
    const t=target(a);

    total+=d.revenue;

    rows+=`

    <tr>

      <td>
        ${a.name}
      </td>

      <td>
        ${money(t)}
      </td>

      <td>
        ${money(d.revenue)}
      </td>

      <td>
        ${money(
          Math.max(
            0,
            t-d.revenue
          )
        )}
      </td>

      <td>
        ${pct(
          Math.min(
            100,
            d.revenue/t*100
          )
        )}
      </td>

    </tr>

    `;
  }

  document.getElementById(
    "gesamt"
  ).innerHTML=`

  <div class="panel">

    <h2>
      Gesamtübersicht
      · ${monthLabel(k)}
    </h2>

    <table>

      <thead>

        <tr>
          <th>Bereich</th>
          <th>Jahresziel</th>
          <th>Ist</th>
          <th>Fehlt</th>
          <th>Erreicht</th>
        </tr>

      </thead>

      <tbody>

        ${rows}

        <tr>

          <th>Gesamt</th>

          <th>
            ${money(
              state.settings.gesamt
            )}
          </th>

          <th>
            ${money(total)}
          </th>

          <th>
            ${money(
              Math.max(
                0,
                state.settings.gesamt-total
              )
            )}
          </th>

          <th>
            ${pct(
              Math.min(
                100,
                total/
                state.settings.gesamt*
                100
              )
            )}
          </th>

        </tr>

      </tbody>

    </table>

  </div>

  `;
}

function renderMissing(){

  const k=monthKey();

  let cards="";

  for(
    const [id,a]
    of Object.entries(areas)
  ){

    const d=monthArea(k,id);
    const t=target(a);
    const f=Math.max(
      0,
      t-d.revenue
    );

    cards+=`

    <div class="card">

      <small>
        ${a.name}
      </small>

      <div
        class="big ${
          f
          ?"red"
          :"green"
        }"
      >

        ${
          f
          ?money(f)+" fehlen"
          :"Ziel erreicht"
        }

      </div>

      <div class="hint">

        Ist:
        ${money(d.revenue)}

        · Ziel:
        ${money(t)}

      </div>

    </div>

    `;
  }

  document.getElementById(
    "missing"
  ).innerHTML=`

  <div class="panel">

    <h2>
      Was fehlt noch?
      · ${monthLabel(k)}
    </h2>

    <div class="cards">

      ${cards}

    </div>

  </div>

  `;
}

function renderHistory(){

  const ks=
    Object.keys(
      state.months
    ).sort();

  let rows=
    ks.map(k=>{

      let total=0;

      for(
        const id
        of Object.keys(areas)
      ){
        total+=
          monthArea(k,id).revenue;
      }

      return `

      <tr>

        <td>
          ${monthLabel(k)}
        </td>

        <td>
          ${money(
            monthArea(
              k,
              "own"
            ).revenue
          )}
        </td>

        <td>
          ${money(
            monthArea(
              k,
              "zorn"
            ).revenue
          )}
        </td>

        <td>
          ${money(
            monthArea(
              k,
              "biewer"
            ).revenue
          )}
        </td>

        <td>
          ${money(
            monthArea(
              k,
              "deckers"
            ).revenue
          )}
        </td>

        <td>
          ${money(total)}
        </td>

      </tr>

      `;

    }).join("");

  document.getElementById(
    "history"
  ).innerHTML=`

  <div class="panel">

    <h2>
      Monatsverlauf
    </h2>

    <p class="hint">
      Jeder Monat wird separat gespeichert.
      Die Eingabeseiten arbeiten immer
      mit dem aktuellen Monat.
    </p>

    <table>

      <thead>

        <tr>
          <th>Monat</th>
          <th>Eigen</th>
          <th>Zorn</th>
          <th>Biewer</th>
          <th>Deckers</th>
          <th>Gesamt</th>
        </tr>

      </thead>

      <tbody>

        ${
          rows ||
          "<tr><td colspan=6>Noch keine Monate gespeichert.</td></tr>"
        }

      </tbody>

    </table>

  </div>

  `;
}

function renderSettings(){

  document.getElementById(
    "settings"
  ).innerHTML=`

  <div class="panel">

    <h2>
      Ziele & Annahmen
    </h2>

    <div class="grid2">

      <div class="field">

        <label>
          Gesamtziel (€)
        </label>

        <input
          id="sGesamt"
          value="${state.settings.gesamt}"
        >

      </div>

      <div class="field">

        <label>
          Dein Ziel / 30% (€)
        </label>

        <input
          id="sOwn"
          value="${state.settings.own}"
        >

      </div>

      <div class="field">

        <label>
          Umsatz pro Kunde (€)
        </label>

        <input
          id="sCustomer"
          value="${state.settings.customer}"
        >

      </div>

      <div class="field">

        <label>
          Abschlussquote (%)
        </label>

        <input
          id="sClose"
          value="${state.settings.close}"
        >

      </div>

      <div class="field">

        <label>
          Mindestkontakte bis Dezember
        </label>

        <input
          id="sContacts"
          value="${state.settings.contacts}"
        >

      </div>

      <div class="field">

        <label>
          Vertriebspartner pro Serientermin
        </label>

        <input
          id="sPartners"
          value="${state.settings.partners}"
        >

      </div>

    </div>

    <button
      class="btn gold"
      onclick="saveSettings()"
    >
      Einstellungen speichern
    </button>

    <div
      class="notice"
      style="margin-top:12px"
    >

      Automatische Umsatzverteilung:

      <b>Team Zorn 40%</b>
      · <b>du 30%</b>
      · <b>Team Biewer 15%</b>
      · <b>Team Deckers 15%</b>.

    </div>

  </div>

  <div class="panel">

    <h2>
      Passwort ändern
    </h2>

    <div class="grid2">

      <div class="field">

        <label>
          Benutzername
        </label>

        <input
          id="newUser"
          value="${state.credentials.user}"
        >

      </div>

      <div class="field">

        <label>
          Neues Passwort
        </label>

        <input
          id="newPass"
          type="password"
        >

      </div>

    </div>

    <button
      class="btn gold"
      onclick="changeCreds()"
    >
      Zugang ändern
    </button>

  </div>

  `;
}

function saveSettings(){

  state.settings={

    gesamt:num("sGesamt"),
    own:num("sOwn"),
    customer:num("sCustomer"),
    close:num("sClose"),
    contacts:num("sContacts"),
    partners:num("sPartners")

  };

  save();
  renderAll();
}

function changeCreds(){

  const u=
    document.getElementById(
      "newUser"
    ).value.trim();

  const p=
    document.getElementById(
      "newPass"
    ).value;

  if(!u||!p){

    return alert(
      "Bitte Benutzername und Passwort eingeben."
    );

  }

  state.credentials={
    user:u,
    pass:p
  };

  save();

  alert(
    "Zugang geändert."
  );
}

function renderGuide(){

  document.getElementById(
    "guide"
  ).innerHTML=`

  <div class="panel">

    <h2>
      📘 Anleitung
    </h2>

    <p>
      1. Wähle oben
      <b>Eigenvolumen</b>,
      <b>Team Zorn</b>,
      <b>Team Biewer</b>
      oder
      <b>Team Deckers</b>.
    </p>

    <p>
      2. Trage Umsatz, Kunden,
      Kontakte und Serientermine
      für den aktuellen Monat ein.
    </p>

    <p>
      3. Speichere den Bereich.
      Die Werte werden getrennt
      nach Monat und Bereich gespeichert.
    </p>

    <p>
      4. Unter
      <b>Gesamtübersicht</b>
      werden alle vier Bereiche
      automatisch zusammengeführt.
    </p>

    <p>
      5. Unter
      <b>Verlauf</b>
      bleiben die bereits gespeicherten
      Monate sichtbar.
    </p>

    <div class="notice">

      Hinweis:
      Die Daten werden lokal im Browser
      dieses Geräts gespeichert.

      „Daten sichern“ exportiert
      eine JSON-Datei als Backup.

    </div>

  </div>

  `;
}

function exportData(){

  const blob=
    new Blob(
      [
        JSON.stringify(
          state,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );

  const a=
    document.createElement("a");

  a.href=
    URL.createObjectURL(blob);

  a.download=
    "repraesentanzleiter-backup.json";

  a.click();

  URL.revokeObjectURL(
    a.href
  );
}

function renderAll(){

  renderDashboard();

  renderArea("own");
  renderArea("zorn");
  renderArea("biewer");
  renderArea("deckers");

  renderGesamt();
  renderMissing();
  renderHistory();
  renderSettings();
  renderGuide();

}

</script>
